<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주간내신 관제</title>
<meta name="robots" content="noindex,nofollow">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{--navy:#0F1B33;--gold:#E8A33D;--bg:#0B1424;--card:#152135;--line:#243347;
      --ink:#EDF1F7;--mut:#8E9CB3;--new:#E8A33D;--bill:#4FA3E3;--paid:#3EC08A;--done:#6E7C93;--cancel:#C4563E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic',sans-serif;
     font-size:15px;line-height:1.55;padding-bottom:40px}
.top{position:sticky;top:0;z-index:9;background:rgba(11,20,36,.94);backdrop-filter:blur(10px);
     border-bottom:1px solid var(--line);padding:14px 16px 12px}
.top h1{font-size:17px;font-weight:900;letter-spacing:-.02em}
.top h1 span{color:var(--gold)}
.sum{display:flex;gap:7px;margin-top:11px;overflow-x:auto;scrollbar-width:none}
.sum::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:11px;
      padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0B1424}
.chip b{color:var(--ink);margin-left:5px;font-weight:900}
.chip.on b{color:#0B1424}
.rev{margin-top:10px;font-size:13px;color:var(--mut)}
.rev b{color:var(--gold);font-size:19px;font-weight:900;letter-spacing:-.02em}
.wrap{padding:14px 16px}
.gate{max-width:340px;margin:70px auto;text-align:center}
.gate h2{font-size:22px;font-weight:900;margin-bottom:8px}
.gate p{color:var(--mut);font-size:13.5px;margin-bottom:20px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:14px;color:var(--ink);font-size:16px;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:0}
.bmain{width:100%;margin-top:11px;background:var(--gold);color:#0B1424;font-size:16px;
       font-weight:900;padding:14px;border-radius:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px;
      border-left:4px solid var(--line)}
.card.s신규{border-left-color:var(--new)}
.card.s청구발송{border-left-color:var(--bill)}
.card.s결제완료,.card.s발송중{border-left-color:var(--paid)}
.card.s완료{border-left-color:var(--done);opacity:.6}
.card.s취소{border-left-color:var(--cancel);opacity:.45}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch .who{font-size:16.5px;font-weight:900;letter-spacing:-.02em}
.ch .who i{font-style:normal;color:var(--mut);font-weight:600;font-size:13.5px;margin-left:6px}
.st{flex:0 0 auto;font-size:11.5px;font-weight:900;padding:5px 10px;border-radius:999px}
.st.신규{background:rgba(232,163,61,.18);color:var(--new)}
.st.청구발송{background:rgba(79,163,227,.18);color:var(--bill)}
.st.결제완료,.st.발송중{background:rgba(62,192,138,.18);color:var(--paid)}
.st.완료{background:rgba(110,124,147,.2);color:var(--done)}
.st.취소{background:rgba(196,86,62,.18);color:var(--cancel)}
.meta{margin-top:7px;font-size:13px;color:var(--mut);line-height:1.7}
.meta b{color:var(--ink);font-weight:700}
.scope{margin-top:9px;background:rgba(255,255,255,.04);border-radius:10px;padding:9px 11px;
       font-size:12.5px;color:#B9C6D8;line-height:1.6;word-break:break-all}
.acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.a{flex:1;min-width:78px;text-align:center;text-decoration:none;font-size:13px;font-weight:800;
   padding:10px 6px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--ink)}
.a.p{background:var(--gold);color:#0B1424}
.a.g{background:rgba(62,192,138,.2);color:var(--paid)}
.a.x{background:rgba(196,86,62,.16);color:var(--cancel);flex:0 0 46px;min-width:46px}
.empty{text-align:center;color:var(--mut);padding:56px 20px;font-size:14px;line-height:1.8}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:800;margin-bottom:6px}
.err{background:rgba(196,86,62,.14);border:1px solid rgba(196,86,62,.4);color:#F0A08C;
     border-radius:11px;padding:12px 14px;font-size:13.5px;margin-bottom:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,20,36,.96);backdrop-filter:blur(10px);
     border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom));
     display:flex;gap:8px}
.bar a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:800;
       padding:11px;border-radius:11px;background:rgba(255,255,255,.07);color:var(--ink)}
.bar a.k{background:var(--gold);color:#0B1424}
</style>

<div id="gate" class="gate">
  <h2>주간내신 관제</h2>
  <p>열쇠를 넣으면 이 기기에 저장됩니다.<br>다음부터는 바로 열립니다.</p>
  <input id="key" type="password" placeholder="열쇠" autocomplete="off">
  <button class="bmain" onclick="unlock()">열기</button>
  <div id="gerr" style="margin-top:12px"></div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <h1>주간내신 <span>관제</span></h1>
    <div class="sum" id="sum"></div>
    <div class="rev" id="rev"></div>
  </div>
  <div class="wrap" id="list"></div>
  <div class="bar">
    <a href="https://www.payssam.kr" target="_blank">결제선생</a>
    <a href="../v2/" target="_blank">랜딩</a>
    <a class="k" href="#" onclick="load();return false">새로고침</a>
  </div>
</div>

<script>
var SUPA="https://sqogiblaagmmkpwwodgf.supabase.co";
var ANON="sb_publishable_JJMJVY4pC9zL25xHDf91Kg_meLV8iwT";
var KEY=null, ROWS=[], FILTER="미완료";
var ORDER=["신규","청구발송","결제완료","발송중","완료","취소"];
var $=function(i){return document.getElementById(i)};

function rpc(fn,body){
  return fetch(SUPA+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"content-type":"application/json","apikey":ANON,"authorization":"Bearer "+ANON},
    body:JSON.stringify(body)}).then(function(r){
      return r.json().then(function(j){ if(!r.ok) throw new Error(j.message||"오류"); return j; });
    });
}
function unlock(){
  var k=$("key").value.trim(); if(!k) return;
  rpc("jugan_list",{p_key:k}).then(function(rows){
    KEY=k; try{localStorage.setItem("jugan_key",k)}catch(e){}
    ROWS=rows; $("gate").style.display="none"; $("app").style.display="block"; render();
  }).catch(function(e){ $("gerr").innerHTML='<div class="err">'+e.message+'</div>'; });
}
function load(){
  if(!KEY) return;
  rpc("jugan_list",{p_key:KEY}).then(function(r){ROWS=r;render()})
    .catch(function(e){$("list").innerHTML='<div class="err">'+e.message+'</div>'});
}
function esc(s){return String(s==null?"":s).replace(/[<>&"]/g,function(c){
  return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]})}
function tel(p){return String(p||"").replace(/\D/g,"")}
function ago(t){
  var d=(Date.now()-new Date(t).getTime())/1000;
  if(d<3600) return Math.max(1,Math.floor(d/60))+"분 전";
  if(d<86400) return Math.floor(d/3600)+"시간 전";
  return Math.floor(d/86400)+"일 전";
}
function set(id,st){
  var memo=null;
  if(st==="취소"){ memo=prompt("취소 사유 (선택)")||null; }
  rpc("jugan_set",{p_key:KEY,p_id:id,p_status:st,p_memo:memo}).then(load)
    .catch(function(e){alert(e.message)});
}
function billSms(r){
  var t="["+"주간내신] "+(r.name||"")+" 학생 신청 확인했습니다.\n"
    +(r.school||"")+" "+(r.grade||"")+" · 자료 시즌패스 69,000원\n"
    +"결제 링크를 문자로 보내드립니다. 결제 확인되면 1주차 자료가 바로 나갑니다.\n\n다올105 010-7789-5094";
  return "sms:"+tel(r.pphone||r.phone)+"?body="+encodeURIComponent(t);
}
function render(){
  var cnt={}; ORDER.forEach(function(s){cnt[s]=0});
  ROWS.forEach(function(r){ if(cnt[r.status]!=null) cnt[r.status]++ });
  var paid=ROWS.filter(function(r){return ["결제완료","발송중","완료"].indexOf(r.status)>=0}).length;

  var chips='<div class="chip'+(FILTER==="미완료"?" on":"")+'" onclick="FILTER=\'미완료\';render()">처리 필요<b>'
    +(cnt["신규"]+cnt["청구발송"])+'</b></div>';
  chips+='<div class="chip'+(FILTER==="전체"?" on":"")+'" onclick="FILTER=\'전체\';render()">전체<b>'+ROWS.length+'</b></div>';
  ORDER.forEach(function(s){ if(cnt[s]) chips+='<div class="chip'+(FILTER===s?" on":"")
    +'" onclick="FILTER=\''+s+'\';render()">'+s+'<b>'+cnt[s]+'</b></div>' });
  $("sum").innerHTML=chips;
  $("rev").innerHTML='결제 완료 <b>'+paid+'명</b> · 매출 <b>'+(paid*69000).toLocaleString()+'원</b>';

  var view=ROWS.filter(function(r){
    if(FILTER==="전체") return true;
    if(FILTER==="미완료") return r.status==="신규"||r.status==="청구발송";
    return r.status===FILTER;
  });
  if(!view.length){ $("list").innerHTML='<div class="empty"><b>처리할 것이 없습니다.</b>새 신청이 들어오면 여기 뜹니다.</div>'; return; }

  $("list").innerHTML=view.map(function(r){
    var a='';
    if(r.status==="신규"){
      a='<a class="a p" href="'+billSms(r)+'" onclick="setTimeout(function(){set('+r.id+',\'청구발송\')},600)">청구 문자</a>'
       +'<a class="a" href="tel:'+tel(r.phone)+'">전화</a>'
       +'<a class="a g" href="#" onclick="set('+r.id+',\'결제완료\');return false">결제됨</a>'
       +'<a class="a x" href="#" onclick="set('+r.id+',\'취소\');return false">✕</a>';
    } else if(r.status==="청구발송"){
      a='<a class="a g" href="#" onclick="set('+r.id+',\'결제완료\');return false">결제 확인됨</a>'
       +'<a class="a" href="'+billSms(r)+'">재발송</a>'
       +'<a class="a x" href="#" onclick="set('+r.id+',\'취소\');return false">✕</a>';
    } else if(r.status==="결제완료"){
      a='<a class="a p" href="#" onclick="set('+r.id+',\'발송중\');return false">1주차 발송함</a>'
       +'<a class="a" href="sms:'+tel(r.pphone||r.phone)+'">문자</a>';
    } else if(r.status==="발송중"){
      a='<a class="a" href="#" onclick="set('+r.id+',\'완료\');return false">시즌 종료 처리</a>'
       +'<a class="a" href="sms:'+tel(r.pphone||r.phone)+'">문자</a>';
    } else {
      a='<a class="a" href="#" onclick="set('+r.id+',\'신규\');return false">되돌리기</a>';
    }
    return '<div class="card s'+esc(r.status)+'">'
      +'<div class="ch"><div class="who">'+esc(r.name||"이름 없음")
      +'<i>'+esc(r.school||"")+' '+esc(r.grade||"")+'</i></div>'
      +'<span class="st '+esc(r.status)+'">'+esc(r.status)+'</span></div>'
      +'<div class="meta">'+ago(r.created_at)+' 접수 · 학생 <b>'+esc(r.phone||"-")+'</b>'
      +(r.pphone?' · 학부모 <b>'+esc(r.pphone)+'</b>':'')+'</div>'
      +(r.scope||r.note||r.memo ? '<div class="scope">'
        +(r.scope?'<b>범위</b> '+esc(r.scope)+'<br>':'')
        +(r.note?'<b>메모</b> '+esc(r.note)+'<br>':'')
        +(r.memo?'<b>처리</b> '+esc(r.memo):'')+'</div>' : '')
      +'<div class="acts">'+a+'</div></div>';
  }).join("");
}
(function(){
  var k=null; try{k=localStorage.getItem("jugan_key")}catch(e){}
  if(k){ $("key").value=k; unlock(); }
})();
setInterval(function(){ if(KEY) load(); }, 60000);
</script>
